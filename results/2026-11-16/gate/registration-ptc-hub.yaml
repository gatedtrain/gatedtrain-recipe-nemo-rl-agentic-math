    # 0.2.0 (sha256:2d90f842...; before the rename sha256:f8e356f4..., see rename_proof).
    manifest_hash: "sha256:a2eac88bfec1af38d81bfb88fb4eb4407eef29374a2690f2f60b3446df1a5b82"
multiplicity:
